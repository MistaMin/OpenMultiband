[package]
name = "openmultiband"
description = "OpenMultiband: 1-to-6-band Linkwitz-Riley multiband dynamics (decompressor, gate/expander, compressor, de-expander per band + global limiter) on OpenPluginSDK with GoodLookin DRI"
version = "1.0.0-beta"
authors = ["Marcos Quirino Deida"]
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
olm-api = { path = "crates/api" }
dynamics = { path = "crates/dynamics" }
dyn-deexpand = { path = "crates/dyn-deexpand" }
dyn-decompress = { path = "crates/dyn-decompress" }
# OpenPluginSDK main (07f97e1) in ../../Dependencies (pinned in scripts/build.sh).
openplugin = { path = "../../Dependencies/OpenPluginSDK/crates/openplugin" }
# Text measuring for the kit: the GoodLookin DRI in the SDK's tree, the same crate the SDK uses.
goodlookindri-shell = { path = "../../Dependencies/OpenPluginSDK/crates/goodlookindri/shell" }

[dev-dependencies]
# The SDK's conformance kit and bench harness (openplugin::testing); nothing of it ships in the plugin.
openplugin = { path = "../../Dependencies/OpenPluginSDK/crates/openplugin", features = ["testing"] }

[workspace]
members = ["crates/*"]

[profile.release]
opt-level = 3
lto = "thin"
